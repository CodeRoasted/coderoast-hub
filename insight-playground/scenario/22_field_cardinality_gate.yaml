# 22 field_cardinality_gate — Sift's value-slot gates: a categorical shift SURVIVES; a measurement
# and a small-sample, many-valued integer column are DECLINED, each under its own reason.
#
# WHAT IT PINS, as one inseparable set of three:
#   • RECALL — `lb route tier` is a genuine categorical (3 values over 70 records, 3/70 well inside
#     the 2/5 distinct-per-sample ratio). Its distribution really moves (60/6/4 -> 30/12/28), so a
#     FieldShift MUST fire.
#   • PRECISION, BY SYNTAX — `db query latency N ms` is a measurement: the token after the slot is the
#     catalog unit `ms` (DN-128.D5), so value syntax declines it, and value syntax is asked BEFORE
#     uniqueness (DN-128.D9). The report must NAME it under `summary.not_judged.measurement_syntax`,
#     never under `high_uniqueness`, although its 883-value band also fails the ratio: the reason a
#     reader is given has to be the true one. Its values really move, and no FieldShift may fire.
#   • PRECISION, BY UNIQUENESS — `pool worker slot N leased` is a bare integer with no unit: 15
#     distinct values in 19 records on each side (bands 1..45 then 50..90, disjoint), so 15 x 5 > 19 x 2
#     fails the ratio. Until DN-128.D8 the ratio was asked only from 16 distinct values up, so this
#     cell was judged and minted a FieldShift on a move its own 19-draw sample cannot resolve. It is
#     declined now and named under `summary.not_judged.high_uniqueness`, and no FieldShift may fire.
#
# ALL THREE PARAMS GENUINELY MOVE, which is the point: the gates must separate them on WHAT THEY
# ARE, not on whether anything changed. A gate that keyed on movement would fire on all three.
#
# ON FLAW-22, AND A CORRECTION. This fixture was listed as FLAW-22-blocked (JSON fields nested and
# string-quoted). That was WRONG, and re-measuring it is what showed why: 22's values live in the
# MESSAGE (`db query latency 100 ms`), not in JSON fields, so the field-emission shape never reached
# it. What actually blocked the migration was nothing — it was never tried. The generators below are
# `emit: false` (FLAW-23) precisely so they stay template inputs and no `k=v` tail appears, which is what
# keeps the vehicle identical to the retired pair's.
#
# ITS RELATION TO FIXTURE 36. Both carry a latency the value-syntax gate declines: 36's `{latency}ms`
# carries its unit in the value, 22's `{latency} ms` in the template. 36 pins the disclosure on a
# re-run and a 5x regression; 22 pins that the syntax reason wins over uniqueness on a slot both
# would decline, and that the uniqueness ratio holds below 16 distinct values.
#
# The 15-in-19 cell was measured on this seed (2222) from the engine's own cardinality, read off the
# `FieldShift` row the pre-DN-128.D8 engine minted (insight-eidos 853c0b66). A 1..50 band reaches 16
# distinct and was rejected: it would sit above the retired floor and witness nothing new.

deterministic_scenario:
  name: insight-field-cardinality-gate
  seed: 2222
  coordinatization: 2

  outputs:
    - name: insight
      type: insight_shm
      channel: ipl_field_cardinality
      format: json                       # the VEHICLE: newline-delimited JSON, level + message only
      shm_slot_count: 256
      shm_backpressure_policy: block

  causal_axis:
    edges:
      # ONE compound edge moving ALL THREE params at once — deliberately, because the claim is a
      # SEPARATION. Moving them in different transitions would let each be judged alone and would
      # never test that the gates tell them apart in the same report.
      - name: shift-all-params
        upsert:
          # The categorical really moves: tier 1 loses half its mass to tier 3.
          - path: agents.lb.fields.tier
            value:
              name: tier
              generator: weighted_choice
              values: ["1", "2", "3"]
              weights: [30, 12, 28]
              emit: false
          # The measurement really moves too: the whole latency band lifts by 9 ms.
          - path: agents.db.fields.latency
            value: { name: latency, generator: range, min: 109, max: 991, integer: true, emit: false }
          # The small-sample column really moves too: a disjoint band of the same width class.
          - path: agents.pool.fields.slot
            value: { name: slot, generator: range, min: 50, max: 90, integer: true, emit: false }

    time_axis:
      duration_seconds: 20
      start_time_unix_ns: 1700000000000000000
      timezone: UTC

      agents:
        # THE CATEGORICAL — 3 values, so the 4A.2 ratio test sees a real category.
        - name: lb
          rate_per_second: 3.45          # -> 70 records
          message_template: "lb route tier {tier} ready"
          fields:
            - name: tier
              generator: weighted_choice
              values: ["1", "2", "3"]
              weights: [60, 6, 4]
              emit: false                # a TEMPLATE INPUT (FLAW-23) — no `k=v` tail, as the retired pair

        # THE MEASUREMENT — `100 ms` is space-separated, so the VALUE is a bare integer and the unit is
        # a token of the TEMPLATE (`<*> ms`): value syntax declines it through the template (DN-128.D5),
        # before the ratio is asked (DN-128.D9).
        - name: db
          rate_per_second: 3.45          # -> 70 records
          message_template: "db query latency {latency} ms"
          fields:
            - { name: latency, generator: range, min: 100, max: 982, integer: true, emit: false }

        # THE SMALL-SAMPLE MANY-VALUED COLUMN — a bare integer, no unit anywhere, 15 distinct in 19.
        - name: pool
          rate_per_second: 0.9           # -> 19 records
          message_template: "pool worker slot {slot} leased"
          fields:
            - { name: slot, generator: range, min: 1, max: 45, integer: true, emit: false }

# ── The bundled contract ─────────────────────────────────────────────────────────────────────────
contract_scenario:
  reference_scenario: insight-field-cardinality-gate

  positions:
    - name: before
      coordinates: { causal_axis: null,              time_axis: 20s }
    - name: after
      coordinates: { causal_axis: shift-all-params,  time_axis: 20s }

  transitions:
    - from: before
      to: after
      compare: RAW.run
      expect:
        ranked_changes:
          must_fire:
            - { kind: FieldShift, template: "lb route tier" }
          must_not_emit:
            - { kind: FieldShift, template: "db query latency" }
            - { kind: FieldShift, template: "pool worker slot" }
        not_judged:
          # The reason is a claim: the latency is declined because it is a measurement, so it is named
          # under measurement syntax even though its band also fails the uniqueness ratio (DN-128.D9).
          measurement_syntax_slots:
            must_name: ["db query latency"]
          # The small-sample column is declined by the uniqueness ratio, and named under it: every
          # declined slot is named, whichever gate declines it (DN-128.D9).
          high_uniqueness_slots:
            must_name: ["pool worker slot"]
        untouched_projection:
          exclude_rows:
            # The categorical is the ONLY thing allowed to surface. The retired pair could forbid a
            # latency FieldShift by name; this forbids everything else too — including any row on the
            # latency template of a kind nobody thought to name.
            - { template: "lb route tier" }
