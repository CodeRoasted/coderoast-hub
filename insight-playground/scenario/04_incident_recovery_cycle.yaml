# 04_incident_recovery_cycle
# Scenario — what it does: A service that goes healthy -> incident -> recovered within one window.
#
# A LogCraft scenario / declarative contract — see insight-playground/HOW_TO_READ.md.

deterministic_scenario:
  name: "incident-recovery-cycle"
  seed: 42

  outputs:
    - name: insight-stream
      type: insight_shm
      channel: ipl_incident_recovery
      shm_slot_count: 256
      shm_backpressure_policy: block
  time_axis:
    duration_seconds: 30m
    environment:
      region: us-east-1
      cluster: prod-payments
      version: v3.1.0

    agents:
      - name: payment-api
        intent: api_service
        rate_per_second: 120/s
        error_rate: 0.005
        latency_ms: [5, 40]
        level_weights: {debug: 0.04, info: 0.76, warn: 0.20, error: 0.80, fatal: 0.20}
        message_template: "{method} /v1/payments/{endpoint} -> {status_code}"
        fields:
          - name: method
            generator: weighted_choice
            values: [POST, GET, PUT]
            weights: [70, 20, 10]
          - name: endpoint
            generator: weighted_choice
            values: [charge, refund, status, authorize, capture]
            weights: [45, 15, 25, 10, 5]
          - name: status_code
            generator: weighted_choice
            values: ["200", "201", "400", "422", "500", "503"]
            weights: [60, 15, 8, 7, 6, 4]
            level_overrides:
              "500": error
              "503": error
              "422": warn
              "400": warn

        phases:
          - name: healthy
            duration_seconds: 10m
            rate_per_second: 120/s
            error_rate: 0.005
            latency_ms: [5, 40]

          - name: incident
            duration_seconds: 10m
            rate_per_second: 95/s
            error_rate: 0.45
            latency_ms:
              distribution: percentile
              p50: 180
              p95: 2400
              p99: 8000

          - name: recovery
            duration_seconds: 10m
            rate_per_second: 118/s
            error_rate: 0.008
            latency_ms: [6, 55]

      - name: postgres-primary
        intent: database
        rate_per_second: 200/s
        error_rate: 0.002
        latency_ms: [2, 15]
        level_weights: {debug: 0.05, info: 0.85, warn: 0.10, error: 1.0}
        message_template: "{query_type} {schema}.{table}: {rows_affected} rows in {duration_ms} ms"
        fields:
          - name: query_type
            generator: weighted_choice
            values: [SELECT, INSERT, UPDATE, DELETE, BEGIN, COMMIT]
            weights: [50, 20, 15, 8, 4, 3]
          - name: schema
            generator: choice
            values: [payments, accounts]
          - name: table
            generator: weighted_choice
            values: [transactions, payment_intents]
            weights: [60, 40]
          - name: rows_affected
            generator: range
            min: 0
            max: 500
            integer: true
          - name: duration_ms
            generator: range
            min: 1
            max: 50
            integer: true

        phases:
          - name: healthy
            duration_seconds: 10m
            rate_per_second: 200/s
            error_rate: 0.002
            latency_ms: [2, 15]

          - name: overloaded
            duration_seconds: 10m
            rate_per_second: 35/s
            error_rate: 0.88
            latency_ms:
              distribution: percentile
              p50: 4500
              p95: 15000
              p99: 30000

          - name: recovering
            duration_seconds: 10m
            rate_per_second: 190/s
            error_rate: 0.01
            latency_ms: [3, 25]

      # THE RECOGNISED-RECOVERY CARRIER. The two agents above emit every one of their templates in
      # all three phases, so their recovery is a rate snap-back and nothing of theirs VANISHES. This
      # agent is an error-class line the pool has logged since startup and that the incident's
      # remediation clears: it runs through `healthy` and `incident`, then goes silent in `recovery`
      # while the workload holds — the one shape the detector reads as a recovery rather than a
      # fault. It carries a low-cardinality field only, so it cannot trip a value-space detector.
      # 5/s is about 1.5 % of a healthy window and 3.7 % of an incident one: a vanish is read only
      # for a line that held at least 1 % of the window before it went, and at 1/s this one did not.
      - name: pool-guard
        rate_per_second: 0
        log_level: error
        message_template: "connection pool {pool} saturated: acquire timed out, request retried"
        fields:
          - name: pool
            generator: weighted_choice
            values: [payments-rw, payments-ro]
            weights: [80, 20]

        phases:
          - { name: healthy,  duration_seconds: 10m, rate_per_second: 5 }
          - { name: incident, duration_seconds: 10m, rate_per_second: 5 }
          - { name: recovery, duration_seconds: 10m, rate_per_second: 0 }

    incidents:
      - name: db_connection_pool_exhausted
        trigger: "time > 10m"
        duration_seconds: 10m
        effects:
          - target: postgres-primary
            latency_multiplier: 120
            error_rate: 0.88
          - target: payment-api
            latency_multiplier: 6
            error_rate: 0.45

# ── The bundled contract (unified grammar, axis-dsl §4.3) ─────────────────────────────────────
# `positions:` are the claim ANCHORS — each a named coordinate vector plus the border read AT
# it. The instrument below is what every one of those claims is pinned to.
contract_scenario:
  reference_scenario: incident-recovery-cycle
  pyramid_config:
    ladder:
      levels: 3
  metalog_config:
    top_k_size: 128
    # Tier-2 salience retention — the shipped streaming tuple (`G-R1` arm C, profile
    # `salience-1/k128-m64-c0-e16`). All FOUR members are spelled, the cap included at the value it
    # would also inherit: a precision fixture mirrors `default_insight_pipeline_config()`
    # field-for-field (§9 PREC-PYR), and an unstated member is how the gate ends up measuring an
    # instrument nobody ships.
    reservoir_size: 64
    reservoir_per_kind_cap: 0
    reservoir_error_reserve: 16
    ngram_size: 3
    max_ngram_keys: 16384
    max_param_histograms: 4
    max_histogram_values: 8
  sequence:
    branching_delta_threshold_bits: 3.5
  explain_min_confidence: 0.75
  positions:
  - name: recovered
    coordinates:
      time_axis: 120s
    signal:
      must_fire: []
      must_not_fire:
      - RAW.acute . Spk . template_count
      - RAW.acute . Nep . acute_new_templates

    interpretation:
      must_not_emit:
      - severity: High
      - severity: Critical
