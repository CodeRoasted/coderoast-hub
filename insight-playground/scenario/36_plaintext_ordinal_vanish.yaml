# 36 plaintext_ordinal_vanish — the PLAIN-TEXT demo path (§4A.5 `LSRC-15` + `LSRC-18`): a vanished
# recurrence LEADS, a real categorical move SURVIVES, and a bare re-run emits no FieldShift at all.
#
# WHAT IT PINS, across five arms sharing one vehicle:
#   • THE RE-RUN BOUNDARY (precision) — do(nothing changed; the job simply ran again): every route's
#     latency stream is re-based onto a fresh seed, so the draws are uncorrelated but the generator,
#     the band and the per-endpoint n are identical. Nothing may vanish, nothing may read as a new
#     error, nothing may reach Medium or High, and no FieldShift may form on any template.
#   • THE VANISH (recall) — `order completed total=<*>` stops. VanishedTemplate / High, and it must
#     TOP-RANK the report.
#   • THE DOLLAR VANISH — the same claim on a currency-prefixed ordinal (`total=$<*>`), which masks
#     down a different path than the bare one.
#   • THE SURVIVOR (recall, second pole) — a genuine categorical move (search status 200 → 200/500)
#     must fire and must be attributed to the STATUS param, not to the latency param sitting beside
#     it on the same template. Without this arm the precision claims are a blind spot: "no FieldShift
#     off latency" reads green just as well if the channel were dead.
#   • THE DISCLOSED REGRESSION (the boundary, said aloud) — a real 5x regression on `/api/orders`
#     emits no row, because the slot is not judged, and the report says it declined that slot: its
#     `summary.not_judged` lists the `/api/orders` template (DN-128.D4).
#
# ── WHAT DECIDES THE RE-RUN ARM: A CATALOG UNIT, IN THE VALUE OR IN THE TEMPLATE ────────────────
# Canon masks a digit-leading token wholesale, so `200 23ms` masks to `<*> <*>` and the value kept
# for the latency slot is the raw token `23ms`. Before a value slot becomes a FieldShift row, Sift's
# measurement-syntax rule (`LSRC-15`, in insight-eidos since 2026-06-26) DROPS it when values
# written as a number with a decimal point or a catalog unit (`ms`, `s`, `kb`, `%`, ...) make up at
# least half of its mass, OR, since 2026-10-04, when the template names the unit right after the
# slot: `200 23 ms` masks to `<*> <*> ms`, and the token after the latency's wildcard is `ms`. The
# drop leaves no row; the slot is counted and listed in the report's `not_judged` disclosure. No
# plain-text format feeds the order-aware ordinal channel, so on this vehicle nothing else reads
# the latency at all.
#
# Measured 2026-10-04, one variable at a time, in this fixture's own harness:
#   ① `{latency}ms` (a catalog unit in the value, the authored form): the re-run arm emits ZERO rows.
#   ② `{latency} ms` (a catalog unit in the template): ZERO rows, the whole fixture green, as ①.
#   ③ `{latency}` (a bare integer, no unit anywhere), everything else unchanged: the re-run floods
#     all seven routes — seven FieldShift rows on `param[1]`, every one Low, JSD 0.07–0.09.
#   ④ `{latency}msec` (a unit outside the catalog): the same seven rows as ③, figure for figure, so
#     the catalog decides.
# (On 2026-10-01, before the template reading, ② flooded exactly as ③ does now.)
#
# The 2026-07-19 record this header used to carry — "`{latency}ms` and `{latency} ms` give the same
# rows" and "a re-run floods all seven routes" — is CONTRADICTED by every binary measurable since
# 2026-10-01, on which `{latency}ms` never floods, and by the rule's logic, which reads the value's
# suffix exactly as it did when it landed. Whether that run used a vehicle
# whose token had lost its suffix cannot be checked without a build of that date.
#
# So the re-run arm asserts ZERO FieldShift rows, on any template. That is robust, not a knife-edge:
# the rule decides lexically, every latency value here is `<n>ms`, and no seed can move the verdict.
# It is not vacuous: the SURVIVOR arm, on the same vehicle, must fire a FieldShift on the status
# param. And it was shown red first: on a scratch copy written with a bare `{latency}` it fails
# with the seven rows of ③.
#
# ── THE RE-RUN ARM'S STATED LIMIT — it is NOT a latency-regression gate ──────────────────────────
# The conclusion is old; the reason is new. The unit-suffixed latency slot is not JUDGED at all, so
# a real 5x regression on one route (`/api/orders` 4..80ms -> 200..400ms, disjoint supports) emits
# no row (measured 2026-10-01 on the generated pair), exactly as a re-run does. Without the rule the
# bare-integer form would not catch it either: on that pair the route reads JSD 0.09, third of seven,
# inside the re-run's own noise band, because a categorical statistic discards value order and a
# latency regression is a shift in location. Plain-text latency is a declared blind spot (FLAW-14);
# a latency regression is detected on a named JSON field the ordinal channel reads, never here.
# Recorded in-fixture so nobody reads this arm's green as "a latency regression would have been
# caught" — it would not have been. The REGRESSION arm pins exactly that, with the disclosure beside
# it: measured 2026-10-02 through the `sift` CLI (insight-eidos 2800b515) on the two rendered
# coordinates, 0 rows and 1 slot declined for measurement syntax, `INFO request GET /api/orders <*>
# <*>`. Red first, measured 2026-10-04 in this fixture's harness: on a bare-integer `{latency}` copy,
# 1 Low FieldShift (JSD 0.11) and no declined slot, so the arm goes red; a `{latency} ms` copy names
# its unit in the template, is declined like the authored form, and the arm stays green.

# ── WHY THE ARMS ARE ORDERED THE WAY THEY ARE ───────────────────────────────────────────────────
# The RNG is position-stable, so an untouched agent emits bit-identical values at every coordinate —
# the axis property, and what makes `exclude_rows` a real assertion (measured: perturbing a route
# band produces rows the projection catches). The churn is therefore isolated in the re-run arm,
# and every later arm reads FROM the re-run coordinate so its latencies are fixed across the edge
# and its claims are about the intervention alone.

deterministic_scenario:
  name: insight-plaintext-ordinal-vanish
  seed: 3636
  coordinatization: 2

  outputs:
    - name: insight
      type: insight_shm
      channel: ipl_plaintext_vanish
      format: raw                        # the VEHICLE: the payload, and nothing but the payload —
      shm_slot_count: 512                # the `INFO`/`ERROR` head is author-written, as the .log had
      shm_backpressure_policy: block

  causal_axis:
    edges:
      # ── THE RE-RUN. do(nothing changed — the job simply ran again): every route's latency stream
      #    is RE-BASED onto a fresh seed (ADR-10.D4: a declared `seed:` re-bases the identity-derived
      #    stream while the name still keys it). Same generator, same band, same n per endpoint —
      #    an uncorrelated draw from the identical distribution, which is what a re-run IS.
      - name: job-rerun
        upsert:
          - { path: agents.route-orders.seed, value: 900001 }
          - { path: agents.route-checkout.seed, value: 907920 }
          - { path: agents.route-cart.seed, value: 915839 }
          - { path: agents.route-products.seed, value: 923758 }
          - { path: agents.route-payments.seed, value: 931677 }
          - { path: agents.route-healthz.seed, value: 939596 }
          - { path: agents.route-profile.seed, value: 947515 }

      # ── MAIN. do(the order pipeline stops): the recurrence vanishes and NOTHING else does. Read
      #    from `job-rerun`, so both sides carry the re-based streams and the latencies are
      #    bit-identical across THIS edge — the churn is isolated in the arm above, where it belongs.
      - name: orders-stopped
        upsert:
          - path: agents.order-completed.rate_per_second
            value: 0

      # ── Sets up the DOLLAR arm: the same recurrence carrying a currency-prefixed ordinal
      #    (`total=$<*>`), which masks down a different path than the bare one.
      - name: dollar-billing
        upsert:
          - path: agents.order-completed.rate_per_second
            value: 1.16                  # -> 24 records
          - path: agents.order-completed.message_template
            value: "INFO order completed total=${total}"

      # ── DOLLAR. The same vanish, on the currency form, with another re-run around it.
      - name: dollar-orders-stopped
        upsert:
          - path: agents.order-completed.rate_per_second
            value: 0

      # ── Sets up the SURVIVOR arm: the search route comes online, all-healthy. The order agent is
      #    restored so it is present and IDENTICAL on both sides of that arm and cancels out.
      - name: search-online
        upsert:
          - path: agents.order-completed.rate_per_second
            value: 1.16
          - path: agents.route-search.rate_per_second
            value: 1.16                  # -> 24 records

      # ── SURVIVOR. do(search starts failing) — a genuine CATEGORICAL move on the status param,
      #    with the latency churn continuing around it. One must fire; the other must not.
      - name: search-degraded
        upsert:
          - path: agents.route-search.fields.status
            value:
              name: status
              generator: weighted_choice
              values: ["200", "500"]
              weights: [10, 14]
              emit: false

      # ── REGRESSION. do(the orders route slows 5x): `/api/orders` draws 200..400ms instead of
      #    4..80ms, disjoint supports, and nothing else moves. Last on the axis, so it reads FROM
      #    `search-degraded` and no earlier arm sees it.
      - name: orders-regressed
        upsert:
          - path: agents.route-orders.fields.latency
            value:
              name: latency
              generator: range
              min: 200
              max: 400
              integer: true
              emit: false

    time_axis:
      duration_seconds: 20
      start_time_unix_ns: 1700000000000000000
      timezone: UTC

      agents:
        # ── The route bed: 5 routes at 14 records, 2 at 13 — the retired pair's exact per-endpoint
        #    counts (a rate r over D emits floor(D*r)+1 records). The `200` is literal because it is
        #    literal in every one of those lines; only `/api/search` needs it as a param.
        #
        #    NOTE `{latency}ms` — ADJACENT, no space. That single character is what keeps the token
        #    a unit-suffixed measurement instead of a bare integer, and it is the whole content of
        #    the correction in the header.
        - name: route-orders
          rate_per_second: 0.66          # -> 14 records
          message_template: "INFO request GET /api/orders 200 {latency}ms"
          fields:
            - { name: latency, generator: range, min: 4, max: 80, integer: true, emit: false }
        - name: route-checkout
          rate_per_second: 0.66
          message_template: "INFO request POST /api/checkout 200 {latency}ms"
          fields:
            - { name: latency, generator: range, min: 4, max: 80, integer: true, emit: false }
        - name: route-cart
          rate_per_second: 0.66
          message_template: "INFO request GET /api/cart 200 {latency}ms"
          fields:
            - { name: latency, generator: range, min: 4, max: 80, integer: true, emit: false }
        - name: route-products
          rate_per_second: 0.66
          message_template: "INFO request GET /api/products 200 {latency}ms"
          fields:
            - { name: latency, generator: range, min: 4, max: 80, integer: true, emit: false }
        - name: route-payments
          rate_per_second: 0.66
          message_template: "INFO request POST /api/payments 200 {latency}ms"
          fields:
            - { name: latency, generator: range, min: 4, max: 80, integer: true, emit: false }
        - name: route-healthz
          rate_per_second: 0.61          # -> 13 records
          message_template: "INFO request GET /healthz 200 {latency}ms"
          fields:
            - { name: latency, generator: range, min: 4, max: 80, integer: true, emit: false }
        - name: route-profile
          rate_per_second: 0.61
          message_template: "INFO request GET /api/user/profile 200 {latency}ms"
          fields:
            - { name: latency, generator: range, min: 4, max: 80, integer: true, emit: false }

        # The steady error background. Present and unchanged at every coordinate, so a NewErrorPattern
        # can never be what leads the report — the vanish has to earn the top rank on its own.
        - name: gateway-timeout
          rate_per_second: 0.36          # -> 8 records
          message_template: "ERROR payment gateway timeout after 3000ms (txn {txn})"
          fields:
            - { name: txn, generator: range, min: 48390, max: 99899, integer: true, emit: false }

        # THE VANISHING RECURRENCE. Its ordinal is a bare `total=<*>` here and a currency
        # `total=$<*>` after the `dollar-billing` edge.
        - name: order-completed
          rate_per_second: 0.46          # -> 10 records
          message_template: "INFO order completed total={total}"
          fields:
            - { name: total, generator: range, min: 12, max: 475, integer: true, emit: false }

        # THE SURVIVOR's carrier. Silent in the base (rate 0 IS silence); its status is a param
        # precisely because the SURVIVOR arm moves it.
        - name: route-search
          rate_per_second: 0
          message_template: "INFO request GET /api/search {status} {latency}ms"
          fields:
            - { name: status, generator: choice, values: ["200"], emit: false }
            - { name: latency, generator: range, min: 4, max: 80, integer: true, emit: false }

# ── The bundled contract ─────────────────────────────────────────────────────────────────────────
contract_scenario:
  reference_scenario: insight-plaintext-ordinal-vanish

  positions:
    - name: orders-flowing
      coordinates: { causal_axis: null,                           time_axis: 20s }
    - name: reran
      coordinates: { causal_axis: job-rerun,                      time_axis: 20s }
    - name: orders-gone
      coordinates: { causal_axis: orders-stopped,        time_axis: 20s }
    - name: dollar-flowing
      coordinates: { causal_axis: dollar-billing,                 time_axis: 20s }
    - name: dollar-gone
      coordinates: { causal_axis: dollar-orders-stopped, time_axis: 20s }
    - name: search-healthy
      coordinates: { causal_axis: search-online,                  time_axis: 20s }
    - name: search-failing
      coordinates: { causal_axis: search-degraded,       time_axis: 20s }
    - name: orders-slow
      coordinates: { causal_axis: orders-regressed,      time_axis: 20s }

  transitions:
    # THE RE-RUN BOUNDARY — see the header. A pure re-run is not an incident: nothing may vanish,
    # nothing may read as a new error or reach the page band, and no FieldShift may form on ANY
    # template — the unit-suffixed latency slot is never judged (`LSRC-15`), so the re-based draws
    # cannot move it. The edge re-bases the route bed and nothing else, so a row off that bed fails.
    - from: orders-flowing
      to: reran
      compare: RAW.run
      expect:
        ranked_changes:
          must_not_emit:
            - { kind: VanishedTemplate }
            - { kind: NewErrorPattern }
            - { kind: FieldShift }
            - { severity: High }
            - { severity: Medium }
        untouched_projection:
          exclude_rows:
            - { template: "request" }

    # MAIN — the vanish leads, and nothing else moves at all.
    - from: reran
      to: orders-gone
      compare: RAW.run
      expect:
        ranked_changes:
          must_fire:
            - { kind: VanishedTemplate, template: "order completed", severity: High }
          must_not_emit:
            - { kind: FieldShift }
          top_rank: { kind: VanishedTemplate }
          attributable_to: ["order completed"]
        untouched_projection:
          # The vanish is the WHOLE report. The retired pair could forbid FieldShift by name; this
          # forbids every row on every route, of any kind nobody thought to name — which is the only
          # form in which "the churn is silent" is actually a claim.
          exclude_rows:
            - { template: "order completed" }

    # DOLLAR — the same vanish on a currency-prefixed ordinal, and another re-run around it.
    - from: dollar-flowing
      to: dollar-gone
      compare: RAW.run
      expect:
        ranked_changes:
          must_fire:
            - { kind: VanishedTemplate, template: "order completed", severity: High }
          must_not_emit:
            - { kind: FieldShift }
        untouched_projection:
          exclude_rows:
            - { template: "order completed" }

    # SURVIVOR — the categorical move fires; the latency param on the same template does not.
    - from: search-healthy
      to: search-failing
      compare: RAW.run
      expect:
        ranked_changes:
          must_fire:
            - { kind: FieldShift, template: "search" }
          must_not_emit:
            - { kind: FieldShift, template: "param[1]" }
        untouched_projection:
          exclude_rows:
            - { template: "search" }

    # REGRESSION — the 5x latency regression on `/api/orders` emits no row, because the unit-suffixed
    # slot is not judged (`LSRC-15`), and the report SAYS so: the declined slot is disclosed under
    # `summary.not_judged`, naming the `/api/orders` template. Without the disclosure this arm
    # would publish the blind spot as a contract (DN-128.D4).
    - from: search-failing
      to: orders-slow
      compare: RAW.run
      expect:
        ranked_changes:
          must_not_emit:
            - { kind: FieldShift }
        untouched_projection:
          exclude_rows:
            - { template: "/api/orders" }
        not_judged:
          measurement_syntax_slots:
            must_name: ["/api/orders"]
