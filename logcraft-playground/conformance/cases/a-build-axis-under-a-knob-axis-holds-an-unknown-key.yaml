deterministic_scenario:
  name: parity-tower
  seed: 6
  outputs:
  - name: gha
    type: console
    format: github_actions
  knob_axis:
    path: noise.log_duplication_rate
    increment: 0.01
    cardinality: 2
    build_axis:
      dialect: github
      duration_seconds: 20
      noise:
        log_duplication_rate: 0.0
      agents:
      - name: job
        intent:
          kind: job
          payload: build
      - name: lint
        intent:
          kind: step
          payload: lint
        after: job
        rate_per_second: 4
        message_template: linting {file}
        fields:
        - name: file
          generator: choice
          values:
          - a.ts
          - b.ts
      bogus: 1
