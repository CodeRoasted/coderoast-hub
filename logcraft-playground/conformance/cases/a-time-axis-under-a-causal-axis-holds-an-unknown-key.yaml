deterministic_scenario:
  name: parity-causal
  seed: 3
  outputs:
  - name: out
    type: console
    format: json
  causal_axis:
    edges:
    - name: quiet
      upsert:
      - path: agents.app.rate_per_second
        value: 0
    time_axis:
      duration_seconds: 10
      agents:
      - name: app
        intent: service
        rate_per_second: 1
        message_template: x
      bogus: 1
