deterministic_scenario:
  name: parity-det
  seed: 7
  outputs:
  - name: out
    type: console
    format: json
  pipeline:
    num_shards: 1
    policy: block
  time_axis:
    environment:
      region: eu-west-1
    noise:
      log_duplication_rate: 0.0
    users:
      count: 10
      sessions:
        duration_seconds:
        - 60
        - 600
        requests_per_session:
        - 3
        - 5
    field_variations:
    - field: size
      jitter_percent: 5.0
    incidents:
    - name: spike
      trigger: time > 5s
      duration_seconds: 2
      effects:
      - target: app
        error_rate: 0.5
    agents:
    - name: app
      intent: web_server
      rate_per_second: 2
      log_level: info
      message_template: '{method} {size}'
      noise:
        missing_fields_rate: 0.0
      fields:
      - name: method
        generator: choice
        values:
        - GET
        - POST
      - name: size
        generator: range
        min: 1
        max: 9
        integer: true
      - name: tier
        generator: conditional
        condition_field: method
        branches:
          GET:
            generator: static
            value: read
        default:
          generator: static
          value: write
      phases:
      - name: warm
        duration_seconds: 5
        rate_per_second: 1
    flows:
    - name: checkout
      instance_rate_per_second: 1
      max_concurrent: 1
      correlation_field: trace_id
      start_state: auth
      states:
        auth:
          agent: app
          message_template: auth
        done:
          agent: app
          message_template: done
      transitions:
      - from: auth
        to: done
