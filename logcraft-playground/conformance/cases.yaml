# The LogCraft DSL conformance set: every case an implementation of the DSL must judge as stated.
# A `refuse` case proves one rule: a schema site (`#/$defs/<def>:<keyword>`), a closed position
# (`position:<where>`) or a semantic rule (`semantic:<id>`, scenario_reference.md § Semantic rules).
# Its `control` differs from it by that one mutation and must be accepted, so the refusal can only
# be the rule's. An `accept` case must load.
cases:
- file: cases/the-document-root-holds-an-unknown-key.yaml
  label: the document root holds an unknown key
  verdict: refuse
  rule: position:#
  control: bases/det.yaml
- file: cases/the-real-root-holds-an-unknown-key.yaml
  label: the real root holds an unknown key
  verdict: refuse
  rule: position:#.scenario
  control: bases/real.yaml
